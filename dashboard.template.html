<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughput</title>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f1f2f3;
    --ink: #0d0e0f;
    --ink-secondary: #4f5356;
    --muted: #83878a;
    --gridline: #e2e4e5;
    --axis: #c2c5c7;
    --series: #2a78d6;
    --warn-bg: #fff1ee;
    --warn-border: #d94f2b;
    --warn-ink: #7a1f0d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #191a1b;
      --page: #0b0c0d;
      --ink: #ffffff;
      --ink-secondary: #c0c3c4;
      --muted: #83878a;
      --gridline: #2a2c2d;
      --axis: #3a3c3d;
      --series: #3987e5;
      --warn-bg: #2a1510;
      --warn-border: #d9633f;
      --warn-ink: #ffb4a0;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  #stale {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-ink);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-weight: 600;
    font-size: 15px;
  }
  #stale[hidden] { display: none; }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  header .generated {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 16px;
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--gridline);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 120px;
    flex: 1 1 120px;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
  }
  .stat .label {
    color: var(--ink-secondary);
    font-size: 12px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--gridline);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin: 0 0 8px;
  }
  .panel svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .people-section h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin: 24px 0 8px;
  }
  #people {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #people button {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--gridline);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    text-align: left;
  }
  #people button .chip-login {
    font-weight: 600;
    font-size: 13px;
  }
  #people button .chip-lines {
    color: var(--muted);
    font-size: 11px;
  }
  #people button[aria-pressed="true"] {
    border-color: var(--series);
    background: color-mix(in srgb, var(--series) 12%, var(--surface));
  }
  #people button[aria-pressed="true"] .chip-login {
    color: var(--series);
  }
  button:focus-visible {
    outline: 2px solid var(--series);
    outline-offset: 2px;
  }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .axis-tick { stroke: var(--axis); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 11px; }
  .series-line { fill: none; stroke: var(--series); stroke-width: 2; }
  .series-dot { fill: var(--series); }
  .reference-line { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap">
  <div id="stale" role="alert" hidden>
    Stale data. The nightly collector has not run in over 48 hours, so these numbers may no longer reflect reality.
  </div>
  <header>
    <h1>Contributor throughput</h1>
    <p class="generated" id="generated"></p>
    <div class="stats" id="stats"></div>
  </header>
  <section class="panel">
    <h2>Qualifying lines per working day</h2>
    <svg id="lines" viewBox="0 0 920 220" role="img" aria-label="Qualifying lines per working day"></svg>
  </section>
  <section class="panel">
    <h2>Qualifying pull requests per working day</h2>
    <svg id="prs" viewBox="0 0 920 220" role="img" aria-label="Qualifying pull requests per working day"></svg>
  </section>
  <section class="people-section">
    <h2>Contributors</h2>
    <div id="people"></div>
  </section>
</div>
<script>
const HISTORY = /*__DATA__*/;

const els = {
  lines: document.getElementById('lines'),
  prs: document.getElementById('prs'),
  people: document.getElementById('people'),
  stale: document.getElementById('stale'),
  generated: document.getElementById('generated'),
  stats: document.getElementById('stats'),
}

let selected = null

const median = (nums) => {
  if (nums.length === 0) return 0
  const sorted = [...nums].sort((a, b) => a - b)
  const mid = Math.floor(sorted.length / 2)
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2
}

const orgRate = (week, metric) => week.workingDays > 0 ? week.totals[metric] / week.workingDays : 0

const contributorRate = (week, login, metric) => {
  const c = week.contributors.find((row) => row.login === login)
  if (!c || week.workingDays === 0) return 0
  return c[metric] / week.workingDays
}

const medianRateSeries = (metric) =>
  HISTORY.weeks.map((week) => {
    if (week.workingDays === 0 || week.contributors.length === 0) return 0
    const rates = week.contributors.map((c) => c[metric] / week.workingDays)
    return median(rates)
  })

const niceStep = (max) => {
  if (max <= 0) return 1
  const rough = max / 4
  const mag = Math.pow(10, Math.floor(Math.log10(rough)))
  const norm = rough / mag
  const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10
  return step * mag
}

const tickIndices = (n, want) => {
  if (n <= 1) return [0]
  const count = Math.min(want, n)
  const out = new Set()
  for (let i = 0; i < count; i++) out.add(Math.round((i * (n - 1)) / (count - 1)))
  return [...out].sort((a, b) => a - b)
}

const fmtNum = (n) => Math.round(n).toLocaleString()

const drawPanel = (svg, weeks, series, referenceSeries) => {
  const W = 920, H = 220
  const padL = 48, padR = 14, padT = 14, padB = 26
  const plotW = W - padL - padR
  const plotH = H - padT - padB
  const n = weeks.length

  const allValues = referenceSeries ? series.concat(referenceSeries) : series
  const rawMax = Math.max(0, ...allValues)
  const step = niceStep(rawMax || 1)
  const niceMax = Math.max(step, Math.ceil((rawMax || 1) / step) * step)

  const xFor = (i) => padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW)
  const yFor = (v) => padT + plotH - (v / niceMax) * plotH

  const pathFor = (vals) =>
    vals.map((v, i) => `${i === 0 ? 'M' : 'L'}${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ')

  const gridTicks = []
  for (let t = 0; t <= niceMax + 0.0001; t += step) gridTicks.push(t)

  const gridMarkup = gridTicks.map((t) => {
    const y = yFor(t).toFixed(1)
    return `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"></line>` +
      `<text class="axis-label" x="${padL - 8}" y="${Number(y) + 3}" text-anchor="end">${fmtNum(t)}</text>`
  }).join('')

  const xTicks = tickIndices(n, 9)
  const xMarkup = xTicks.map((i) => {
    const x = xFor(i).toFixed(1)
    const y0 = H - padB
    const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'
    return `<line class="axis-tick" x1="${x}" x2="${x}" y1="${y0}" y2="${y0 + 4}"></line>` +
      `<text class="axis-label" x="${x}" y="${y0 + 16}" text-anchor="${anchor}">${weeks[i].week.slice(2)}</text>`
  }).join('')

  const refMarkup = referenceSeries
    ? `<path class="reference-line" d="${pathFor(referenceSeries)}"></path>`
    : ''

  const dotsMarkup = series.map((v, i) =>
    `<circle class="series-dot" cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="2.2"></circle>`
  ).join('')

  svg.innerHTML = gridMarkup + xMarkup + refMarkup +
    `<path class="series-line" d="${pathFor(series)}"></path>` + dotsMarkup
}

const totalsByLogin = new Map()
for (const week of HISTORY.weeks) {
  for (const c of week.contributors) {
    totalsByLogin.set(c.login, (totalsByLogin.get(c.login) || 0) + c.lines)
  }
}

const buildPeople = () => {
  const people = HISTORY.contributors
    .map((login) => ({ login, lines: totalsByLogin.get(login) || 0 }))
    .sort((a, b) => b.lines - a.lines)

  els.people.innerHTML = people.map((p) =>
    `<button type="button" data-login="${p.login}" aria-pressed="false">` +
    `<span class="chip-login">${p.login}</span>` +
    `<span class="chip-lines">${fmtNum(p.lines)} lines</span>` +
    `</button>`
  ).join('')
}

const updateChips = () => {
  for (const btn of els.people.querySelectorAll('button[data-login]')) {
    btn.setAttribute('aria-pressed', String(btn.dataset.login === selected))
  }
}

const buildStats = () => {
  const totalLines = HISTORY.weeks.reduce((n, w) => n + w.totals.lines, 0)
  const totalPrs = HISTORY.weeks.reduce((n, w) => n + w.totals.prs, 0)
  const stats = [
    { label: 'Weeks tracked', value: HISTORY.weeks.length },
    { label: 'Contributors', value: HISTORY.contributors.length },
    { label: 'Qualifying lines', value: fmtNum(totalLines) },
    { label: 'Qualifying PRs', value: fmtNum(totalPrs) },
  ]
  els.stats.innerHTML = stats.map((s) =>
    `<div class="stat"><div class="value">${s.value}</div><div class="label">${s.label}</div></div>`
  ).join('')
  els.generated.textContent = `Generated ${new Date(HISTORY.generatedAt).toLocaleString()}`
}

const render = () => {
  const weeks = HISTORY.weeks
  const linesSeries = weeks.map((w) => selected ? contributorRate(w, selected, 'lines') : orgRate(w, 'lines'))
  const prsSeries = weeks.map((w) => selected ? contributorRate(w, selected, 'prs') : orgRate(w, 'prs'))
  const linesRef = selected ? medianRateSeries('lines') : null
  const prsRef = selected ? medianRateSeries('prs') : null
  drawPanel(els.lines, weeks, linesSeries, linesRef)
  drawPanel(els.prs, weeks, prsSeries, prsRef)
  updateChips()
}

els.people.addEventListener('click', (event) => {
  const btn = event.target.closest('button[data-login]')
  if (!btn) return
  const login = btn.dataset.login
  selected = selected === login ? null : login
  render()
})

const STALE_MS = 48 * 60 * 60 * 1000
if (Date.now() - Date.parse(HISTORY.generatedAt) > STALE_MS) {
  els.stale.hidden = false
}

buildStats()
buildPeople()
render()
</script>
</body>
</html>
