name: Update throughput

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-throughput
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Refresh throughput data"
          git push

      # Only the rendered page is published. Serving the repo root would put the
      # week caches and the source at the public URL, and the page needs neither
      # because it embeds its own data.
      - name: Stage the page for Pages
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Report failure
        if: failure()
        run: |
          gh issue create \
            --title "Throughput collector failed $(date -u +%F)" \
            --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
